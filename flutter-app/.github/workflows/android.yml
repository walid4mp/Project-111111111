name: WarHex Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build WarHex Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate missing Android platform files
        run: flutter create --platforms=android --project-name warhex_app .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://project-111111111.onrender.com

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/WarHex.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarHex-APK
          path: flutter-app/build/app/outputs/flutter-apk/WarHex.apk
          if-no-files-found: error
          retention-days: 30
