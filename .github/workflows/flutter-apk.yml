name: WarHex Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        working-directory: flutter-app
        run: |
          test -f pubspec.yaml
          echo "Flutter project found"

      - name: Generate Android platform
        working-directory: flutter-app
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name warhex_app .
          fi

      - name: Get packages
        working-directory: flutter-app
        run: flutter pub get

      - name: Build APK
        working-directory: flutter-app
        run: flutter build apk --release --dart-define=API_BASE_URL=https://project-111111111.onrender.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WarHex-APK
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
