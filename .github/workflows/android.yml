name: WarHex Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          java -version

      - name: Install web dependencies
        run: npm ci

      - name: Validate production web build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://project-111111111.onrender.com
        run: npm run build

      - name: Install Capacitor
        run: npm install --no-save --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Generate Android project
        env:
          CAPACITOR_SERVER_URL: https://project-111111111.onrender.com
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure Android SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'compileSdkVersion 35': 'compileSdkVersion 36',
              'targetSdkVersion 35': 'targetSdkVersion 36',
              'compileSdkVersion = 35': 'compileSdkVersion = 36',
              'targetSdkVersion = 35': 'targetSdkVersion = 36',
          }
          for name in ['android/app/build.gradle', 'android/variables.gradle']:
              p = Path(name)
              if p.exists():
                  s = p.read_text()
                  for old, new in replacements.items():
                      s = s.replace(old, new)
                  p.write_text(s)
          PY

      - name: Check Android toolchain
        working-directory: android
        run: ./gradlew --version

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warhex-android-builds
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
